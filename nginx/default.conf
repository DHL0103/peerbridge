# 로컬 개발용 nginx 라우팅.
# peerbridge.local      -> 사용자용 프론트(호스트 :5173, npm run dev) + 백엔드 API
# admin.peerbridge.local -> 관리자용 프론트(호스트 :5174, npm run dev) + 백엔드 API
#
# /etc/hosts에 아래 두 줄이 있어야 브라우저에서 접속 가능:
#   127.0.0.1 peerbridge.local
#   127.0.0.1 admin.peerbridge.local

server {
    listen 80;
    server_name peerbridge.local;

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name admin.peerbridge.local;

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://host.docker.internal:5174;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
