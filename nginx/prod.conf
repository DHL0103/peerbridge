# 프로덕션 nginx 라우팅 — 도메인이 아직 없어서 IP + 포트로 두 프론트를 구분:
#   http://<VPS_IP>/       -> 사용자용 프론트 (peerbridge-web)
#   http://<VPS_IP>:8081/  -> 관리자용 프론트 (peerbridge-admin)
#
# 도메인을 붙이게 되면 이 파일을 서브도메인 기반으로 교체할 것
# (개발용 nginx/default.conf의 server_name 블록 구조 참고 — 포트 분리 대신
#  peerbridge.example.com / admin.peerbridge.example.com 으로 나누고,
#  각 서버 블록에 443 + Let's Encrypt 인증서 설정을 추가).

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/web;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8081;
    server_name _;

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/admin;
        try_files $uri $uri/ /index.html;
    }
}
