name: Deploy

# main에 머지/푸시되면: 이미지 빌드 -> ECR 푸시 -> EC2에 SSH로 접속해 pull 후 재기동.
on:
  push:
    branches: [main]

env:
  ECR_REPOSITORY: peerbridge
  AWS_REGION: ap-northeast-2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # ECR 로그인은 EC2에 미리 설치해둔 amazon-ecr-credential-helper +
          # 인스턴스 IAM Role이 docker pull 시점에 알아서 처리해준다 (DEPLOY.md 참고).
          # 주의: 이 스크립트를 sudo로 감싸면 root의 $HOME을 보게 돼서 credential
          # helper 설정을 못 찾고 "no basic auth credentials" 에러가 난다 — sudo 금지.
          script: |
            cd ~/apps/peerbridge
            docker compose --env-file .env.production -f docker-compose.prod.yml pull web
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d web
            docker image prune -f
