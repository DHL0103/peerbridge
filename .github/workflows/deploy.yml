name: Deploy

on:
  push:
    branches: [main]

env:
  ECR_REPOSITORY: peerbridge
  AWS_REGION: ap-northeast-2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: .env.docker 파일 만들기
        run: echo "${{ secrets.ENV_DOCKER }}" > .env.docker

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY
          script: |
            docker stop peerbridge-web || true
            docker rm peerbridge-web || true
            docker pull $ECR_REGISTRY/peerbridge:latest
            docker run -d --name peerbridge-web -p 8000:8000 \
              --restart unless-stopped \
              $ECR_REGISTRY/peerbridge:latest \
              sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn peerbridge.wsgi:application --bind 0.0.0.0:8000 --workers 3"
            docker image prune -f
        env:
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.registry }}
