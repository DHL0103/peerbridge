# 프로덕션용 compose.
#
# 모든 명령에 --env-file .env.production을 붙여야 ${DB_PASSWORD}, ${ECR_IMAGE} 같은
# 치환이 제대로 된다 (docker compose는 기본으로 정확히 ".env" 파일만 자동 인식함).
#
# web 이미지는 두 가지 방식으로 얻을 수 있다:
#   - CI/CD(.github/workflows/deploy.yml)가 자동으로: main에 푸시되면 ECR에 이미지를
#     빌드/푸시하고, EC2에 SSH로 접속해 `docker compose pull web && up -d web`을 실행한다.
#     이때 image: 필드(.env.production의 ECR_IMAGE)가 실제로 어떤 이미지를 받아올지 결정한다.
#   - 수동으로 로컬 빌드: `docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build`
#     (CI 없이 처음 띄워볼 때, 또는 ECR 없이 그냥 확인만 할 때)
#
# 사전 준비:
#   1. 이 저장소(peerbridge)와 프론트 두 개(peerbridge-web, peerbridge-admin)를
#      VPS의 같은 부모 디렉토리에 나란히 clone (아래 nginx 볼륨 경로가 이 배치를 가정함):
#        ~/apps/peerbridge/          (이 저장소)
#        ~/apps/peerbridge-web/app/  (사용자 프론트, npm run build 완료 상태)
#        ~/apps/peerbridge-admin/    (관리자 프론트, npm run build 완료 상태)
#   2. .env.production 파일을 이 저장소 루트에 작성 (.env.production.example 참고)
#   3. 프론트 두 개는 각자 VITE_API_BASE_URL="" (빈 값)으로 빌드해서 /api 요청이
#      같은 origin의 상대경로로 나가게 함 — nginx가 같은 서버 블록에서 /api를
#      백엔드로 프록시하므로 별도 CORS 설정이 필요 없어짐.
#   4. CI/CD로 자동배포하려면 EC2에 amazon-ecr-credential-helper 설치 + IAM Role
#      (AmazonEC2ContainerRegistryFullAccess) 부착이 필요함 — 자세한 건 DEPLOY.md 참고.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      # 운영 편의를 위해 SSH 터널로만 접근 가능하도록 로컬호스트에만 바인딩.
      # (0.0.0.0으로 열면 전세계에 DB 포트가 노출됨 — 절대 지우지 말 것)
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: ${ECR_IMAGE:-peerbridge-web:local}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      DB_PORT: 3306
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn peerbridge.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "8081:8081"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ../peerbridge-web/app/dist:/usr/share/nginx/web:ro
      - ../peerbridge-admin/dist:/usr/share/nginx/admin:ro
    depends_on:
      - web

volumes:
  mysql_data:
